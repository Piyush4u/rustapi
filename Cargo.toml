[workspace]
resolver = "2"
members = [
    "crates/rustapi-engine",
    "crates/rustapi-py",
    "crates/rustapi-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["rustapi contributors"]
repository = "https://github.com/Piyush4u/rustapi"
description = "A Rust-core Python web framework. Hot paths in Rust, business logic in Python."
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
http-body = "1"
bytes = "1"
# Routing
matchit = "0.8"
# Serialization - simd-json for performance
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.14"
# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27"
# PyO3 — Python bindings
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
# Middleware (Tower)
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "timeout"] }
# Database (sqlx)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "sqlite"] }
# WebSockets
tokio-tungstenite = "0.26"
tungstenite = "0.26"
# HTTP/3 (quinn)
quinn = "0.11"
rustls = "0.23"
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# FastAPI compatibility
pydantic = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
