[package]
name = "rustapi-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Rust-core HTTP engine for rustapi: hyper + tokio + matchit router"

[dependencies]
# Core async & HTTP
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server", "server-auto", "http1", "http2", "tokio"] }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# Routing
matchit = { workspace = true }
# Serialization - simd-json for performance
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
# Logging & Tracing
tracing = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
# Middleware (Tower)
tower = { workspace = true }
tower-http = { workspace = true }
# Database (sqlx)
sqlx = { workspace = true }
# WebSockets
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
# HTTP/3 support
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = "0.13"
# CPU detection
num_cpus = "1"
# Dependency Injection
async-trait = "0.1"
# OpenAPI schema generation
schemars = "0.8"
utoipa = { version = "5", features = ["preserve_order"] }
